<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiTeacherCodex</title>
    <style>
      body { width: 310px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; color: #111; }
      h1 { margin: 0 0 12px; font-size: 17px; }
      label { display: block; margin: 10px 0 5px; font-weight: 600; }
      .toggle { display: flex; gap: 8px; align-items: center; font-weight: 600; }
      input[type="url"] { box-sizing: border-box; width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 7px; }
      .buttons { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 8px; border: 0; border-radius: 7px; cursor: pointer; }
      #save { background: #111; color: white; }
      #check { background: #e9e9e9; color: #111; }
      #status { min-height: 20px; margin-top: 10px; color: #555; }
      p { margin: 10px 0 0; color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>MultiTeacherCodex</h1>
    <label class="toggle"><input id="enabled" type="checkbox" /> Automatically review every answer</label>
    <label for="server-url">Local server</label>
    <input id="server-url" type="url" value="http://127.0.0.1:8787" />
    <div class="buttons">
      <button id="save" type="button">Save</button>
      <button id="check" type="button">Check server</button>
    </div>
    <div id="status"></div>
    <p>The first ChatGPT draft and the internal revision prompt are hidden. Only the revised answer remains visible.</p>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
